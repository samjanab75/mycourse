<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <div class="bg-blue-200 p-6 rounded-lg text-center hover:scale-90 transition duration-300 ">
            Box 1
        </div>

        <div class="bg-green-200 p-6 rounded-lg text-center hover:scale-90 transition duration-300 ">
            Box 2
        </div>

        <div class="bg-yellow-200 p-6 rounded-lg text-center hover:scale-90 transition duration-300 ">
            Box 3
        </div>

        <div class="bg-red-200 p-6 rounded-lg text-center hover:scale-90transition duration-300 ">
            Box 4
        </div>

        <div class="bg-purple-200 p-6 rounded-lg text-center hover:scale-90 transition duration-300 ">
            Box 5
        </div>

        <div class="bg-pink-200 p-6 rounded-lg text-center hover:scale-90 transition duration-300 ">
            Box 6
        </div>

    </div>

</body>
</html>
