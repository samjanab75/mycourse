 <!DOCTYPE html>
<html>

<head>
    <title>Floating Waves Login & Signup</title>
</head>

<body>

    <center>

        <img 
            src="../assets/image/logo.jpg"alt="Floating Waves Logo"width="300"height="300">

        <h1>FLOATING WAVES</h1>

        <p>
            Ride Your Vibe<br>
            Fashion Inspired by the Ocean
        </p>

      
   <h2>Login Form</h2>

        <form>

            <label><b>Email :</b></label><br>

            <input 
                type="email"
                placeholder="Enter your email"
                required>
            <br><br>

            <label><b>Password :</b></label><br>

            <input 
                type="password"
                placeholder="Enter your password"
                minlength="6"
                maxlength="12"
                required>
            <br><br>

            <input type="submit" value="Login">

        </form>

        <br><br>

       <h2>Create New Account</h2>

        <form>

            <label><b>Full Name :</b></label><br>

            <input 
                type="text"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="20"
                required>
            <br><br>

            <label><b>Email :</b></label><br>

            <input 
                type="email"
                placeholder="Enter your email"
                required>
            <br><br>

            <label><b>Create Password :</b></label><br>

            <input 
                type="password"
                placeholder="Create password"
                minlength="6"
                maxlength="12"
                required>
            <br><br>

            <label><b>Confirm Password :</b></label><br>

            <input 
                type="password"
                placeholder="Confirm password"
                minlength="6"
                maxlength="12"
                required>
            <br><br>

            <input type="submit" value="Signup">

            <input type="reset" value="Clear">

        </form>

        <br>

        <p>
            Join Floating Waves and explore modern fashion collections,
            exclusive offers, and stylish trends.
        </p>

    </center>

</body>

</html>
