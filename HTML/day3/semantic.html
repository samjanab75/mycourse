    <html>
<head>
    <title>Semantic Tags Example</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my webpage</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Section -->
        <section>
            <h2>About HTML</h2>
            <p>HTML is used to create webpages.</p>
        </section>

        <!-- Article -->
        <article>
            <h2>Latest News</h2>
            <p>This is an article about web development.</p>
        </article>

        <!-- Aside -->
        <aside>
            <h3>Extra Information</h3>
            <p>This content is related to the main topic.</p>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
