 <script>
    // Inputs
let studentName = "John";
let mark1 = 85;
let mark2 = 90;
let mark3 = 75;

console.log("Student Name:", studentName);

// Arithmetic Operators
let total = mark1 + mark2 + mark3;
console.log("Total (+):", total);

console.log("Subtraction (-):", mark1 - mark2);
console.log("Multiplication (*):", mark1 * mark2);
console.log("Division (/):", mark1 / mark2);
console.log("Modulus (%):", mark1 % mark2);
console.log("Exponent (**):", mark1 ** 2);

// Assignment Operators
let score = 100;

score += 20;
console.log("+= :", score);

score -= 10;
console.log("-= :", score);

score *= 2;
console.log("*= :", score);

score /= 5;
console.log("/= :", score);

// Comparison Operators
console.log("== :", mark1 == "85");
console.log("=== :", mark1 === "85");
console.log("!= :", mark1 != mark2);
console.log("> :", mark1 > mark2);
console.log("< :", mark1 < mark2);
console.log(">= :", mark1 >= 85);
console.log("<= :", mark1 <= 85);

// Logical Operators
let hasAttendance = true;
let hasIDCard = true;
let isBlocked = false;

console.log("&& :", hasAttendance && hasIDCard);
console.log("|| :", hasAttendance || isBlocked);
console.log("! :", !isBlocked);

// Student Result
let average = total / 3;
console.log("Average:", average);

let passed = average >= 40;
console.log("Passed:", passed);
 </script>
