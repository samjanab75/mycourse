 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Employee Salary Calculation</title>
 </head>
 <body>
      <h1>Employee Salary Calculation</h1>

    <p>
        This program calculates the gross salary of an employee.
        The basic salary and bonus are stored in variables.
        The gross salary is calculated by adding the basic salary
        and bonus using the (+) arithmetic operator.
    </p>







     <script>
 
     let EmployeName = "chiran";
     let basicSalary = 25000;
     let bonus= 5000;
     let grossSalary=basicSalary+bonus;
    
     
    console.log(typeof EmployeName,"EmployeName:",EmployeName);
    console.log(typeof basicSalary,"basicSalary:",basicSalary);
    console.log(typeof bonus,"bonus:",bonus);
    console.log(typeof grossSalary,"grossSalary:",grossSalary);
    
    
    
    




     </script>
 </body>
 </html>
