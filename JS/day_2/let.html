 <script>
    

// Declaration
let name;
console.log(typeof name, "name", name);

// Initialization
name = "Samjana";
console.log(typeof name, "name", name);

// Reassignment
name = "John";
console.log(typeof name, "name", name);


// Declaration
let age;
console.log(typeof age, "age", age);

// Initialization
age = 21;
console.log(typeof age, "age", age);

// Reassignment
age = 22;
console.log(typeof age, "age", age);


// Declaration
let city;
console.log(typeof city, "city", city);

// Initialization
city = "Chennai";
console.log(typeof city, "city", city);

// Reassignment
city = "Mumbai";
console.log(typeof city, "city", city);


// Declaration
let salary;
console.log(typeof salary, "salary", salary);

// Initialization
salary = 25000;
console.log(typeof salary, "salary", salary);

// Reassignment
salary = 30000;
console.log(typeof salary, "salary", salary);


// Declaration
let course;
console.log(typeof course, "course", course);

// Initialization
course = "JavaScript";
console.log(typeof course, "course", course);

// Reassignment
course = "React JS";
console.log(typeof course, "course", course);

 </script>
