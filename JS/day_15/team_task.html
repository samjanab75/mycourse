<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>DOM Project</title>
</head>

<body class="bg-gray-100 p-10">

<!-- REGISTER -->

<div id="registerPage" class="bg-white p-5 rounded shadow w-96 mx-auto">
    <h1 class="text-2xl font-bold mb-4">Register</h1>

    <input id="rname" type="text" placeholder="Name"
        class="border p-2 w-full mb-2">

    <input id="remail" type="email" placeholder="Email"
        class="border p-2 w-full mb-2">

    <input id="rpassword" type="password" placeholder="Password"
        class="border p-2 w-full mb-2">

    <button onclick="registerUser()"
        class="bg-blue-500 text-white px-4 py-2 rounded">
        Register
    </button>
</div>

<!-- LOGIN -->

<div id="loginPage"
    class="bg-white p-5 rounded shadow w-96 mx-auto hidden">

    <h1 class="text-2xl font-bold mb-4">Login</h1>

    <input id="lemail" type="email" placeholder="Email"
        class="border p-2 w-full mb-2">

    <input id="lpassword" type="password" placeholder="Password"
        class="border p-2 w-full mb-2">

    <button onclick="loginUser()"
        class="bg-green-500 text-white px-4 py-2 rounded">
        Login
    </button>
</div>

<!-- OTP -->

<div id="otpPage"
    class="bg-white p-5 rounded shadow w-96 mx-auto hidden">

    <h1 class="text-2xl font-bold mb-4">OTP Verification</h1>

    <input id="otpInput"
        placeholder="Enter OTP"
        class="border p-2 w-full mb-2">

    <button onclick="verifyOtp()"
        class="bg-purple-500 text-white px-4 py-2 rounded">
        Verify OTP
    </button>
</div>

<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

    <h1 class="text-3xl font-bold mb-5">
        DOM Tasks Dashboard
    </h1>

    <button onclick="showTask1()"
        class="bg-blue-500 text-white px-4 py-2 rounded">
        Character Counter
    </button>

    <button onclick="showTask2()"
        class="bg-green-500 text-white px-4 py-2 rounded ml-2">
        Age Checker
    </button>

</div>

<!-- TASK 1 -->

<div id="task1"
    class="hidden bg-white p-5 mt-5 rounded shadow">

    <h2 class="text-xl font-bold mb-3">
        Character Counter
    </h2>

    <textarea id="textArea"
        oninput="countChars()"
        class="border w-full p-2"></textarea>

    <p id="count" class="mt-3">
        Total Characters : 0
    </p>

</div>

<!-- TASK 2 -->

<div id="task2"
    class="hidden bg-white p-5 mt-5 rounded shadow">

    <h2 class="text-xl font-bold mb-3">
        Age Category Checker
    </h2>

    <input id="age"
        type="number"
        placeholder="Enter Age"
        class="border p-2">

    <button onclick="checkAge()"
        class="bg-blue-500 text-white px-4 py-2 rounded">
        Check
    </button>

    <h3 id="result" class="mt-3"></h3>

</div>

<script>

let users = [];
let generatedOtp = 0;

/* REGISTER */

function registerUser(){

    let name = document.getElementById("rname").value;
    let email = document.getElementById("remail").value;
    let password = document.getElementById("rpassword").value;

    if(name=="" || email=="" || password==""){
        alert("Fill all fields");
        return;
    }

    users.push({
        name:name,
        email:email,
        password:password
    });

    alert("Registration Successful");

    document.getElementById("registerPage").style.display="none";
    document.getElementById("loginPage").style.display="block";
}

/* LOGIN */

function loginUser(){

    let email = document.getElementById("lemail").value;
    let password = document.getElementById("lpassword").value;

    let user = users.find(
        u => u.email===email && u.password===password
    );

    if(user){

        generatedOtp =
        Math.floor(1000 + Math.random()*9000);

        alert("OTP : " + generatedOtp);

        document.getElementById("loginPage").style.display="none";
        document.getElementById("otpPage").style.display="block";
    }
    else{
        alert("Invalid Credentials");
    }
}

// /* OTP */

function verifyOtp(){

    let otp =
    document.getElementById("otpInput").value;

    if(otp == generatedOtp){

        alert("OTP Verified");

        document.getElementById("otpPage").style.display="none";
        document.getElementById("dashboard").style.display="block";
    }
    else{
        alert("Wrong OTP");
    }
}

/* TASK 1 */

function showTask1(){

    document.getElementById("task1").style.display="block";
    document.getElementById("task2").style.display="none";
}

function countChars(){

    let text =
    document.getElementById("textArea").value;

    document.getElementById("count").textContent =
    "Total Characters : " + text.length;
}

/* TASK 2 */

function showTask2(){

    document.getElementById("task2").style.display="block";
    document.getElementById("task1").style.display="none";
}

function checkAge(){

    let age =
    Number(document.getElementById("age").value);

    if(age <= 12){
        result.textContent = "Child";
    }
    else if(age <= 19){
        result.textContent = "Teenager";
    }
    else if(age <= 59){
        result.textContent = "Adult";
    }
    else{
        result.textContent = "Senior Citizen";
    }
}

</script>

</body>
</html>
