 <!DOCTYPE html>
<html>
<head>
<title>Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f8f8f8;
}

nav{
    background:#222;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    padding:30px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:.5s;
}

.card:hover img{
    transform:scale(1.1);
}

.content{
    padding:20px;
}

.content h3{
    color:red;
    margin-bottom:10px;
}
</style>

</head>
<body>

<nav>
    <a href="profile.html">Profile</a>
    <a href="dashboard.html">Services</a>
    <a href="gallery.html">Gallery</a>
</nav>

<div class="container">

    <div class="card">
        <img src="music-stage.jpg" alt="">
        <div class="content">
            <h3>Music Stage</h3>
            <p>Two hearts, one melody, and a lifetime of love.</p>
        </div>
    </div>

    <div class="card">
        <img src="mandap.jpg" alt="">
        <div class="content">
            <h3>Wedding Mandap</h3>
            <p>The sacred space where two souls begin their journey.</p>
        </div>
    </div>

    <div class="card">
        <img src="reception.jpg" alt="">
        <div class="content">
            <h3>Reception Stage</h3>
            <p>Create beautiful memories and timeless photographs.</p>
        </div>
    </div>

</div>

</body>
</html>
