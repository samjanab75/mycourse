 <!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#f5f5f5,#e8f5e9);
}

nav{
    background:#222;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
}

nav a:hover{
    color:#28a745;
}

.profile{
    display:flex;
    justify-content:center;
    margin-top:40px;
}

.card{
    background:white;
    width:400px;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

img{
    width:180px;
    height:180px;
    border-radius:50%;
    margin:15px 0;
    border:5px solid green;
}

.red{
    color:red;
}

.green{
    color:green;
}

.detail{
    display:flex;
    justify-content:space-around;
    margin:20px 0;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    color:white;
    cursor:pointer;
}

.follow{
    background:green;
}

.message{
    background:red;
}

.call-btn{
    display:inline-block;
    margin-top:15px;
    background:#28a745;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:25px;
}
</style>

</head>
<body>

<nav>
    <a href="profile.html">Profile</a>
    <a href="dashboard.html">Services</a>
    <a href="gallery.html">Gallery</a>
</nav>

<div class="profile">
    <div class="card">

        <h1>Profile</h1>

        <img src="logored.png" alt="Logo">

        <h2>Event Decoration</h2>

        <p>
            Create unforgettable moments with our professional event decoration services.
        </p>

        <h2>
            <span class="red">REDR</span>
            <span class="green">EVENT</span>
        </h2>

        <div class="detail">
            <div>
                <h4>Following</h4>
                <p>700</p>
            </div>

            <div>
                <h4>Followers</h4>
                <p>770</p>
            </div>

            <div>
                <h4>Posts</h4>
                <p>7</p>
            </div>
        </div>

        <button class="follow">Follow Us</button>
        <button class="message">Message</button>

        <br>

        <a href="tel:+919876543210" class="call-btn">
            📞 Call Now
        </a>

    </div>
</div>

</body>
</html>
