 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Content </title>
    <link rel="stylesheet" href="../assets/space.css">
 </head>
 <body>
   
  <h1>justify-content Values</h1>

  <!-- Flex Start -->
  <h2>flex-start</h2>
  <div class="container flex-start">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <!-- Center -->
  <h2>center</h2>
  <div class="container center">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <!-- Flex End -->
  <h2>flex-end</h2>
  <div class="container flex-end">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <!-- Space Between -->
  <h2>space-between</h2>
  <div class="container space-between">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <!-- Space Around -->
  <h2>space-around</h2>
  <div class="container space-around">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <!-- Space Evenly -->
  <h2>space-evenly</h2>
  <div class="container space-evenly">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div> 
 </body>
 </html>
