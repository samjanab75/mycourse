 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Card Event Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Times New Roman', Times, serif;
}

body{
    background-color:rgb(213,194,96);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.profile-card{
    width:420px;
    background-color:rgb(3,36,52);
    color:rgb(240,189,127);
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 45px rgba(87,90,20,0.8);
}

.profile-image{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgb(240,189,127);
    margin-bottom:15px;
}

.profile-card h1{
    margin-bottom:10px;
}

.tagline{
    color:white;
    margin-bottom:25px;
    font-size:18px;
}

.stats{
    display:flex;
    justify-content:space-around;
    padding:15px 0;
    margin:20px 0;
    border-top:1px solid rgba(240,189,127,0.3);
    border-bottom:1px solid rgba(240,189,127,0.3);
}

.stats h3{
    font-size:24px;
}

.about,
.contact{
    margin-top:25px;
}

.about h2,
.contact h2{
    color:white;
    margin-bottom:10px;
}

.about p,
.contact p{
    line-height:1.7;
}

.social{
    margin-top:25px;
}

.social a{
    text-decoration:none;
    display:inline-block;
    background-color:rgb(240,189,127);
    color:rgb(3,36,52);
    padding:10px 15px;
    border-radius:10px;
    margin:5px;
    font-weight:bold;
}

.social a:hover{
    background-color:white;
}

.buttons{
    margin-top:25px;
}

.buttons button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background-color:rgb(240,189,127);
    color:rgb(3,36,52);
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.buttons button:hover{
    background-color:white;
}

@media(max-width:500px){

    .profile-card{
        width:100%;
    }

    .stats{
        flex-direction:column;
        gap:15px;
    }
}
</style>

</head>
<body>

<div class="profile-card">

    <img src="../assets/image/logored.png"
         alt="Red Card Event Logo"
         class="profile-image">

    <h1>RED CARD EVENT</h1>

    <p class="tagline">
        Professional Event Decoration & Management
    </p>

     

    <div class="contact">
        <h2>Contact</h2>

        <p>📞 +91 98765 43210</p>
        <p>✉️ redcardevent@gmail.com</p>
        <p>📍 Chennai, Tamil Nadu</p>
    </div>

    <div class="social">
        <a href="#">📸 Instagram</a>
         
    </div>

    <div class="buttons">
        <button>Follow</button>
        <button>Book Now</button>
    </div>

</div>

</body>
</html>
